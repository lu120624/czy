<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>曹子妤称王</title>
<style>
  :root{
    --gold:#ffd76a;
    --gold-light:#fff0b8;
    --gold-deep:#8a5a1e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px 18px 56px;
    overflow-x:hidden;
    background:radial-gradient(circle at 50% -10%, #2a1548 0%, #140b24 45%, #07030d 100%);
    color:#fff;
    font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC",serif;
    -webkit-tap-highlight-color:transparent;
  }

  /* 背景光束 */
  .rays{
    position:fixed;
    inset:-60%;
    z-index:0;
    background:repeating-conic-gradient(from 0deg,
      rgba(255,215,106,.06) 0deg 5deg,
      transparent 5deg 19deg);
    -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 58%);
            mask-image:radial-gradient(circle, #000 0%, transparent 58%);
    animation:spin 70s linear infinite;
    pointer-events:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg) } }

  /* 铜钱画布 */
  #fx{
    position:fixed;
    inset:0;
    z-index:6;
    pointer-events:none;
  }

  /* ============ 主舞台 ============ */
  .stage{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(10px,2.2vw,20px);
    text-align:center;
    transform-style:preserve-3d;
    transition:transform .25s ease-out;
    will-change:transform;
  }

  .crown{
    font-size:clamp(48px,13vw,92px);
    line-height:1;
    cursor:pointer;
    filter:drop-shadow(0 10px 26px rgba(255,215,106,.45));
    animation:crownDrop 1.15s cubic-bezier(.3,1.5,.5,1) both;
    user-select:none;
  }
  @keyframes crownDrop{
    0%  {opacity:0; transform:translateY(-70vh) rotate(-30deg)}
    62% {opacity:1; transform:translateY(10px) rotate(6deg) scaleY(.88) scaleX(1.08)}
    78% {transform:translateY(-10px) rotate(-4deg) scaleY(1.06) scaleX(.96)}
    90% {transform:translateY(4px) rotate(2deg) scaleY(.97) scaleX(1.03)}
    100%{transform:none}
  }

  .title{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.02em;
    margin:0;
    font-size:clamp(2rem,8.6vw,4.6rem);
    font-weight:900;
    letter-spacing:.06em;
    line-height:1.1;
  }
  .title span{
    display:inline-block;
    cursor:pointer;
    background:linear-gradient(180deg,#fff8dd 0%,var(--gold) 42%,#e0a03a 72%,#a9701a 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    filter:drop-shadow(0 3px 0 rgba(120,72,10,.85))
           drop-shadow(0 0 20px rgba(255,215,106,.42));
    animation:drop .75s cubic-bezier(.2,1.5,.4,1) backwards;
    transition:transform .18s ease, filter .18s ease;
  }
  .title span:nth-child(1){animation-delay:.28s}
  .title span:nth-child(2){animation-delay:.4s}
  .title span:nth-child(3){animation-delay:.52s}
  .title span:nth-child(4){animation-delay:.64s}
  .title span:nth-child(5){animation-delay:.76s}
  .title span:hover{transform:translateY(-6px) scale(1.08)}

  @keyframes drop{
    from{opacity:0; transform:translateY(-56px) rotate(-16deg) scale(.55)}
    to  {opacity:1; transform:none}
  }

  .sub{
    margin:0;
    font-size:clamp(.82rem,2.6vw,1.05rem);
    letter-spacing:.42em;
    text-indent:.42em;
    color:rgba(255,232,176,.72);
    animation:fadeIn 1s ease 1.1s backwards;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }

  /* ============ 操作区 ============ */
  .hud{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:clamp(10px,2.6vw,18px);
    margin-top:4px;
    animation:fadeIn 1s ease 1.3s backwards;
  }
  .treasury{
    padding:9px 20px;
    border:1.5px solid rgba(255,215,106,.42);
    border-radius:999px;
    background:rgba(255,215,106,.07);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    font-size:clamp(.8rem,2.4vw,1rem);
    letter-spacing:.12em;
    color:#ffe9b0;
    white-space:nowrap;
  }
  .treasury b{
    display:inline-block;
    color:var(--gold);
    font-size:1.2em;
    margin:0 4px;
    text-shadow:0 0 14px rgba(255,215,106,.8);
  }

  .btn{
    padding:10px 28px;
    font-family:inherit;
    font-size:clamp(.86rem,2.5vw,1.05rem);
    font-weight:700;
    letter-spacing:.14em;
    color:#ffe9b0;
    border:1.5px solid var(--gold);
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,215,106,.24), rgba(255,215,106,.05));
    cursor:pointer;
    transition:transform .18s ease, box-shadow .25s ease, background .25s ease;
    box-shadow:0 6px 20px rgba(0,0,0,.42);
  }
  .btn:hover{
    background:linear-gradient(180deg, rgba(255,215,106,.46), rgba(255,215,106,.14));
    box-shadow:0 0 26px rgba(255,215,106,.55);
    transform:translateY(-2px);
  }
  .btn:active{transform:translateY(0) scale(.96)}

  /* ============ 臣民 ============ */
  .court{
    display:flex;
    gap:clamp(4px,1.6vw,12px);
    margin-top:2px;
    font-size:clamp(20px,5.4vw,34px);
    line-height:1;
  }
  .court span{
    display:inline-block;
    cursor:pointer;
    user-select:none;
    transition:transform .18s ease;
    animation:sway 3s ease-in-out infinite;
  }
  .court span:nth-child(odd){animation-delay:.4s}
  .court span:nth-child(3n){animation-delay:.9s}
  @keyframes sway{
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%    {transform:translateY(-5px) rotate(3deg)}
  }
  .court span.kow{animation:kow .62s cubic-bezier(.3,1.4,.5,1)}
  @keyframes kow{
    0%  {transform:translateY(0) rotate(0) scale(1)}
    38% {transform:translateY(-20px) rotate(-14deg) scale(1.25)}
    72% {transform:translateY(4px) rotate(4deg) scale(.94)}
    100%{transform:translateY(0) rotate(0) scale(1)}
  }

  /* ============ 提示 ============ */
  .tip{
    position:fixed;
    left:0; right:0; bottom:14px;
    z-index:4;
    text-align:center;
    font-size:clamp(.66rem,2vw,.8rem);
    letter-spacing:.14em;
    color:rgba(255,232,176,.4);
    pointer-events:none;
  }

  /* ============ 圣旨弹窗 ============ */
  .edict-wrap{
    position:fixed;
    inset:0;
    z-index:90;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(4,2,10,.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    opacity:0;
    visibility:hidden;
    transition:opacity .3s ease, visibility .3s;
  }
  .edict-wrap.show{opacity:1; visibility:visible}

  .edict{
    position:relative;
    width:min(460px, 90vw);
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:translateY(20px) scale(.94);
    opacity:0;
    transition:transform .42s cubic-bezier(.2,1.3,.4,1), opacity .32s ease;
  }
  .edict-wrap.show .edict{transform:none; opacity:1}

  .rod{
    width:100%;
    height:18px;
    border-radius:9px;
    background:linear-gradient(180deg,#6d4413 0%,#b98236 35%,#f2cb84 55%,#a06f28 78%,#5c3a10 100%);
    box-shadow:0 6px 18px rgba(0,0,0,.55), inset 0 1px 2px rgba(255,255,255,.35);
  }

  .paper{
    position:relative;
    width:100%;
    min-height:clamp(140px, 34vw, 190px);
    padding:30px 26px 38px;
    background:
      repeating-linear-gradient(90deg, rgba(120,80,20,.045) 0 1px, transparent 1px 7px),
      linear-gradient(180deg,#f9f0cf 0%,#f0e2b6 55%,#e6d3a0 100%);
    box-shadow:inset 0 0 46px rgba(150,110,40,.32), inset 0 0 0 1px rgba(160,120,50,.25);
    color:#452a08;
    font-size:clamp(.9rem,2.7vw,1.05rem);
    line-height:2.1;
    letter-spacing:.06em;
    text-align:justify;
    overflow:hidden;
  }
  .paper p{margin:0}

  .seal-btn{
    position:absolute;
    bottom:-52px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 26px;
    font-family:inherit;
    font-size:.92rem;
    font-weight:700;
    letter-spacing:.16em;
    color:#f3d6d0;
    background:#a3281c;
    border:1.5px solid #d9584a;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(163,40,28,.55);
    transition:transform .16s ease, box-shadow .2s ease;
  }
  .seal-btn:hover{transform:translateX(-50%) translateY(-2px); box-shadow:0 8px 24px rgba(217,88,74,.7)}
  .seal-btn:active{transform:translateX(-50%) scale(.94)}

  /* 红印章 */
  .seal{
    --rot:-12deg;
    position:absolute;
    width:80px; height:80px;
    display:grid;
    place-items:center;
    border:3.5px solid #c0392b;
    border-radius:9px;
    box-shadow:inset 0 0 0 2px rgba(192,57,43,.35);
    color:#c0392b;
    font-size:23px;
    font-weight:700;
    letter-spacing:2px;
    line-height:1;
    writing-mode:vertical-rl;
    text-orientation:upright;
    opacity:.9;
    mix-blend-mode:multiply;
    transform:rotate(var(--rot));
    pointer-events:none;
    animation:stampIn .32s cubic-bezier(.2,1.7,.4,1) both;
  }
  @keyframes stampIn{
    from{transform:rotate(var(--rot)) scale(2.8); opacity:0}
    to  {transform:rotate(var(--rot)) scale(1);   opacity:.9}
  }

  /* 飘字 */
  .float-text{
    position:fixed;
    z-index:50;
    pointer-events:none;
    white-space:nowrap;
    color:var(--gold);
    font-size:15px;
    font-weight:700;
    letter-spacing:.08em;
    text-shadow:0 0 14px rgba(255,215,106,.9), 0 2px 0 rgba(120,72,10,.9);
    transform:translate(-50%,-50%);
    animation:floatUp 1.2s ease-out forwards;
  }
  @keyframes floatUp{
    0%  {opacity:0; transform:translate(-50%,-50%) scale(.6)}
    22% {opacity:1; transform:translate(-50%,-95%) scale(1.12)}
    100%{opacity:0; transform:translate(-50%,-240%) scale(1)}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important}
  }
</style>
</head>
<body>

<div class="rays"></div>
<canvas id="fx"></canvas>

<main class="stage" id="stage">
  <div class="crown" id="crown" title="点我加冕">👑</div>

  <h1 class="title" id="title">
    <span>曹</span><span>子</span><span>妤</span><span>称</span><span>王</span>
  </h1>

  <p class="sub">奉天承运 · 万民臣服</p>

  <div class="hud">
    <div class="treasury">国 库 <b id="gold">0</b> 金</div>
    <button class="btn" id="edictBtn">📜 颁 旨</button>
  </div>

  <div class="court" id="court">
    <span>🙇‍♂️</span><span>🙇‍♀️</span><span>🧎‍♂️</span>
    <span>🧎‍♀️</span><span>🙇‍♂️</span><span>🙇‍♀️</span>
  </div>
</main>

<div class="tip">点击任意处撒铜钱 · 点臣民会磕头 · 点皇冠加冕</div>

<!-- 圣旨 -->
<div class="edict-wrap" id="edictWrap">
  <div class="edict" id="edict">
    <div class="rod"></div>
    <div class="paper" id="paper">
      <p id="edictText"></p>
    </div>
    <div class="rod"></div>
    <button class="seal-btn" id="sealBtn">盖 章</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ======================= 铜钱粒子 ======================= */
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const coins = [];
  const MAX_COINS = 260;

  function addCoin(x, y) {
    if (coins.length > MAX_COINS) coins.shift();
    coins.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 12,
      vy: -Math.random() * 10 - 3,
      r: 7 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.24,
      a: 1,
      life: -1
    });
  }

  function burst(x, y, n) {
    for (let i = 0; i < n; i++) addCoin(x, y);
  }

  function drawCoin(c) {
    const squash = Math.max(0.16, Math.abs(Math.cos(c.rot)));
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(1, squash);

    const h = c.r * 0.36;

    ctx.beginPath();
    ctx.arc(0, 0, c.r, 0, Math.PI * 2);
    ctx.rect(-h, -h, h * 2, h * 2);

    const g = ctx.createLinearGradient(-c.r, -c.r, c.r, c.r);
    g.addColorStop(0,   '#fff3c4');
    g.addColorStop(0.45,'#ffd76a');
    g.addColorStop(1,   '#c88a1e');

    ctx.fillStyle = g;
    ctx.fill('evenodd');

    ctx.lineWidth = 1.3;
    ctx.strokeStyle = 'rgba(118,72,10,.85)';
    ctx.stroke();

    ctx.restore();
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);

    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];

      c.vy += 0.5;
      c.x  += c.vx;
      c.y  += c.vy;
      c.rot += c.vr;

      const floor = H - 6;
      if (c.y > floor) {
        c.y = floor;
        c.vy *= -0.42;
        c.vx *= 0.8;
        if (Math.abs(c.vy) < 1.2) c.vy = 0;
      }

      // 静止后慢慢消失
      if (c.y >= floor - 1 && Math.abs(c.vy) < 1.2 && Math.abs(c.vx) < 0.4) {
        if (c.life < 0) c.life = 70;
        c.life--;
        if (c.life <= 0) { coins.splice(i, 1); continue; }
        c.a = Math.min(1, c.life / 34);
      }

      ctx.globalAlpha = c.a;
      drawCoin(c);
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  loop();

  /* ======================= 国库 ======================= */
  const goldEl = document.getElementById('gold');
  let gold = 0;

  function addGold(n) {
    gold += n;
    goldEl.textContent = gold;
    goldEl.animate(
      [
        { transform: 'scale(1.6)', color: '#ffffff' },
        { transform: 'scale(1)',   color: '#ffd76a' }
      ],
      { duration: 320, easing: 'cubic-bezier(.2,1.5,.4,1)' }
    );
  }

  /* ======================= 飘字 ======================= */
  function floatText(txt, x, y) {
    const d = document.createElement('div');
    d.className = 'float-text';
    d.textContent = txt;
    d.style.left = x + 'px';
    d.style.top  = y + 'px';
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 1250);
  }

  /* ======================= 全局撒钱 ======================= */
  document.addEventListener('pointerdown', function (e) {
    const t = e.target;
    // 按钮 / 圣旨弹窗 不触发撒钱
    if (t.closest('button') || t.closest('.edict-wrap')) return;

    const n = 6 + Math.floor(Math.random() * 6);
    burst(e.clientX, e.clientY, n);
    addGold(n);
  }, { passive: true });

  /* ======================= 皇冠加冕 ======================= */
  const crown = document.getElementById('crown');

  crown.addEventListener('pointerdown', function (e) {
    e.stopPropagation();

    crown.animate(
      [
        { transform: 'scale(1) rotate(0deg)' },
        { transform: 'scale(1.35) rotate(360deg)' },
        { transform: 'scale(1) rotate(720deg)' }
      ],
      { duration: 900, easing: 'ease-in-out' }
    );

    const r = crown.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top  + r.height / 2;

    burst(cx, cy, 42);
    addGold(42);
    floatText('加冕成功！万岁！', cx, cy);
  });

  /* ======================= 标题点字 ======================= */
  document.querySelectorAll('#title span').forEach(function (s) {
    s.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      const r = s.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 5);
      s.animate(
        [
          { transform: 'scale(1) translateY(0)' },
          { transform: 'scale(1.5) translateY(-14px)' },
          { transform: 'scale(1) translateY(0)' }
        ],
        { duration: 380, easing: 'cubic-bezier(.2,1.6,.4,1)' }
      );
    });
  });

  /* ======================= 臣民磕头 ======================= */
  const court = document.getElementById('court');

  court.addEventListener('pointerdown', function (e) {
    const sp = e.target.closest('span');
    if (!sp) return;

    sp.classList.remove('kow');
    void sp.offsetWidth;
    sp.classList.add('kow');

    floatText('万岁万岁万万岁！', e.clientX, e.clientY);
  });

  /* ======================= 圣旨 ======================= */
  const EDICTS = [
    '奉天承运，曹子妤诏曰：今日宜喝奶茶，忌写作业。钦此。',
    '自今日起，举国上下，凡见曹子妤者，必称一声「王上」，违者罚请全糖奶茶一杯。钦此。',
    '曹子妤想吃火锅了，众卿家速速安排，不得有误。钦此。',
    '凡今日点赞者，赏黄金万两；转发者，再赏一万。钦此。',
    '朕乏了，今日不上朝，都散了吧。钦此。',
    '特赐天下百姓快乐一份，烦恼尽数没收，永不复还。钦此。',
    '曹子妤宣布：全宇宙最可爱之人，非她莫属。钦此。',
    '诏告天下：从今往后，你说了算，朕说了更算。钦此。',
    '命御膳房即刻备好炸鸡、薯条、可乐，慢一秒罚俸一年。钦此。',
    '封你为「护驾大将军」，职责是每天夸曹子妤三句，务必认真履职。钦此。',
    '今有贵人路过此地，曹子妤心甚悦，特赐好运一年，即刻生效。钦此。'
  ];

  const edictWrap = document.getElementById('edictWrap');
  const edictEl   = document.getElementById('edict');
  const edictText = document.getElementById('edictText');
  const paper     = document.getElementById('paper');
  const edictBtn  = document.getElementById('edictBtn');
  const sealBtn   = document.getElementById('sealBtn');

  let lastIndex = -1;

  function openEdict() {
    let idx;
    do { idx = Math.floor(Math.random() * EDICTS.length); }
    while (idx === lastIndex && EDICTS.length > 1);
    lastIndex = idx;

    edictText.textContent = EDICTS[idx];

    // 清掉上一份的印章
    paper.querySelectorAll('.seal').forEach(function (s) { s.remove(); });

    // 重置进场动画
    edictEl.style.transition = 'none';
    edictEl.style.transform  = 'translateY(22px) scale(.94)';
    edictEl.style.opacity    = '0';
    void edictEl.offsetWidth;
    edictEl.style.transition = '';
    edictEl.style.transform  = '';
    edictEl.style.opacity    = '';

    edictWrap.classList.add('show');
  }

  edictBtn.addEventListener('click', openEdict);

  edictWrap.addEventListener('pointerdown', function (e) {
    if (e.target === edictWrap) edictWrap.classList.remove('show');
  });

  /* ======================= 盖章 ======================= */
  const SEAL_TEXTS = ['钦此', '准奏', '御批', '照准'];

  sealBtn.addEventListener('click', function (e) {
    e.stopPropagation();

    const seal = document.createElement('div');
    seal.className = 'seal';
    seal.textContent = SEAL_TEXTS[Math.floor(Math.random() * SEAL_TEXTS.length)];

    seal.style.left = (16 + Math.random() * 52) + '%';
    seal.style.top  = (26 + Math.random() * 44) + '%';
    seal.style.setProperty('--rot', ((Math.random() - 0.5) * 34).toFixed(1) + 'deg');

    paper.appendChild(seal);

    // 砸下去的感觉：轻微震屏
    document.body.animate(
      [
        { transform: 'translate(3px, 2px)' },
        { transform: 'translate(-3px, -2px)' },
        { transform: 'translate(2px, -1px)' },
        { transform: 'translate(0, 0)' }
      ],
      { duration: 200, easing: 'ease-out' }
    );

    const r = sealBtn.getBoundingClientRect();
    floatText('已盖玉玺！', r.left + r.width / 2, r.top);
  });

  /* ======================= 鼠标视差倾斜 ======================= */
  const stage = document.getElementById('stage');
  let parallaxOn = window.matchMedia('(min-width: 720px)').matches;

  window.addEventListener('pointermove', function (e) {
    if (!parallaxOn) return;
    const rx = (e.clientY / H - 0.5) * -7;
    const ry = (e.clientX / W - 0.5) * 9;
    stage.style.transform =
      'perspective(1000px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
  }, { passive: true });

  window.addEventListener('resize', function () {
    parallaxOn = window.matchMedia('(min-width: 720px)').matches;
    if (!parallaxOn) stage.style.transform = '';
  });

  /* ======================= 开场撒钱 ======================= */
  setTimeout(function () {
    burst(W / 2, H * 0.76, 34);
    addGold(34);
  }, 1000);

})();
</script>
</body>
</html>
